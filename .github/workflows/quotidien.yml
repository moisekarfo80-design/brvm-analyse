# Mise a jour automatique chaque soir de semaine (heure de Ouagadougou = UTC).
# Lance la collecte des cours puis l'analyse, et enregistre les resultats dans le depot.
# L'application (docs/) lit docs/data/resultats.json.
name: Mise a jour du soir

on:
  schedule:
    - cron: "47 17 * * 1-5"   # 17 h 47, apres la cloture et la publication des cours
    - cron: "13 21 * * 1-5"   # 21 h 13, second essai si le premier a echoue
  workflow_dispatch:           # bouton "Run workflow" pour lancer a la main
    inputs:
      test:
        description: "Tester seulement la lecture du site (rien n'est enregistre)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: mise-a-jour
  cancel-in-progress: false

jobs:
  mise-a-jour:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les outils
        run: pip install -r requirements.txt

      - name: Tester la lecture du site
        if: ${{ inputs.test }}
        run: python serveur/collecte.py --test

      - name: Collecter les cours
        if: ${{ !inputs.test }}
        run: python serveur/collecte.py

      - name: Analyser
        if: ${{ !inputs.test }}
        run: python serveur/analyse.py

      - name: Enregistrer
        if: ${{ !inputs.test }}
        run: |
          git config user.name "brvm-analyse (automatique)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 1) on enregistre d'abord les donnees sources, puis on se met a jour (nos donnees gardent la priorite)
          git add donnees/historique.csv donnees/statut_collecte.json
          git diff --cached --quiet || git commit -q -m "Mise a jour du $(date -u +%d/%m/%Y) (donnees)"
          for i in 1 2 3; do git pull -q --rebase -X theirs origin main && break; sleep 5; done
          # 2) les fichiers calcules sont refaits a partir de l'etat le plus recent, jamais fusionnes
          python serveur/analyse.py
          git add donnees docs/data
          git diff --cached --quiet || git commit -q -m "Mise a jour du $(date -u +%d/%m/%Y) (notes)"
          for i in 1 2 3; do git push -q origin HEAD:main && break; git pull -q --rebase -X theirs origin main; python serveur/analyse.py; git add donnees docs/data; git diff --cached --quiet || git commit -q -m "Mise a jour du (notes, reprise)"; done
