# Lecture des etats financiers annuels publies sur brvm.org.
# Chaque lundi matin, et a la main (onglet Actions > Lecture des bilans > Run workflow).
name: Lecture des bilans

on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:
    inputs:
      exercice:
        description: "Exercice a lire (ex. 2025)"
        default: "2025"
      tout:
        description: "Tout relire, meme les bilans deja valides"
        type: boolean
        default: false
      diag:
        description: "Afficher les lignes lues (diagnostic)"
        type: boolean
        default: false
      pages:
        description: "Seulement lister les pages des societes (test)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: mise-a-jour
  cancel-in-progress: false

jobs:
  bilans:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les outils (lecture PDF et reconnaissance de caracteres)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-fra poppler-utils
          pip install -r requirements.txt

      - name: Lister les pages des societes
        if: ${{ inputs.pages }}
        run: python serveur/bilans.py --pages

      - name: Lire les bilans
        if: ${{ !inputs.pages }}
        run: python serveur/bilans.py ${{ inputs.exercice || '2025' }} ${{ inputs.tout && '--tout' || '' }} ${{ inputs.diag && '--diag' || '' }}

      - name: Recalculer les notes
        if: ${{ !inputs.pages }}
        run: python serveur/analyse.py

      - name: Enregistrer
        if: ${{ !inputs.pages }}
        run: |
          git config user.name "brvm-analyse (automatique)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 1) on enregistre d'abord les donnees sources, puis on se met a jour (nos donnees gardent la priorite)
          git add donnees/bilans.json
          git diff --cached --quiet || git commit -q -m "Bilans lus le $(date -u +%d/%m/%Y) (donnees)"
          for i in 1 2 3; do git pull -q --rebase -X theirs origin main && break; sleep 5; done
          # 2) les fichiers calcules sont refaits a partir de l'etat le plus recent, jamais fusionnes
          python serveur/analyse.py
          git add donnees docs/data
          git diff --cached --quiet || git commit -q -m "Bilans lus le $(date -u +%d/%m/%Y) (notes)"
          for i in 1 2 3; do git push -q origin HEAD:main && break; git pull -q --rebase -X theirs origin main; python serveur/analyse.py; git add donnees docs/data; git diff --cached --quiet || git commit -q -m "Bilans lus le (notes, reprise)"; done
