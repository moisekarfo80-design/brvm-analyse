<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1747C9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BRVM Analyse">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-192.png">
<title>BRVM Analyse</title>
<style>
:root{--bleu:#1747C9;--bleu2:#E6EDFC;--encre:#0E1B3D;--gris:#55607A;--fond:#F2F5FB;--ligne:#DCE3F0;--or:#C98A0B;--rouge:#C0362C;--vert:#138A4B;--orange:#9A5B00;--orange2:#FFF3DC}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--fond);color:var(--encre);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}
.app{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bleu);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 18px 14px;display:flex;align-items:center;gap:12px}
header h1{font-size:18px;margin:0;flex:1;letter-spacing:-.2px}
header small{display:block;font-weight:400;opacity:.85;font-size:12px}
.cloche{position:relative;width:44px;height:44px;border:0;border-radius:14px;background:rgba(255,255,255,.16);color:#fff;font-size:20px;cursor:pointer}
.pastille{position:absolute;top:6px;right:6px;min-width:18px;height:18px;border-radius:9px;background:#FFB020;color:var(--encre);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
main{padding:16px}
.carte{background:#fff;border:1px solid var(--ligne);border-radius:18px;padding:16px;margin-bottom:14px;animation:entree .35s ease-out both}
@keyframes entree{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h2{font-size:17px;margin:0 0 10px}
h3{font-size:15px;margin:0 0 6px}
.gris{color:var(--gris);font-size:13px}
.ligne{display:flex;align-items:center;gap:10px}
.entre{justify-content:space-between}
.meteo{background:linear-gradient(135deg,#1747C9,#3E6BE6);color:#fff;border:0}
.meteo .gros{font-size:44px;line-height:1}
.meteo .gris{color:rgba(255,255,255,.85)}
.barres{display:flex;gap:4px}
.barres i{width:22px;height:8px;border-radius:4px;background:var(--ligne)}
.barres i.on{background:var(--bleu)}
.seg{display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--bleu2);margin-bottom:12px}
.seg button{flex:1;min-height:44px;border:0;border-radius:11px;background:transparent;font-weight:600;color:var(--bleu);cursor:pointer;font-size:14px}
.seg button.on{background:#fff;box-shadow:0 1px 4px rgba(14,27,61,.12)}
.action{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--ligne);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.action:last-child{border-bottom:0}
.rang{width:28px;height:28px;border-radius:9px;background:var(--bleu2);color:var(--bleu);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.action .nom{font-weight:600}
.action .info{flex:1;min-width:0}
.action .info .gris{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.etoiles{color:var(--or);letter-spacing:1px;font-size:14px;white-space:nowrap}
.etoiles .vide{color:#D6DCE8}
.note{font-weight:700;font-size:15px;text-align:right;min-width:52px}
.fleche{font-size:12px;font-weight:600}
.haut{color:var(--vert)}.bas{color:var(--rouge)}
.puce{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:8px;background:var(--orange2);color:var(--orange)}
.bouton{display:flex;align-items:center;justify-content:center;width:100%;min-height:50px;border:0;border-radius:14px;background:var(--bleu);color:#fff;font-weight:700;cursor:pointer;font-size:15px;text-decoration:none}
.bouton.second{background:#fff;color:var(--bleu);border:1px solid var(--ligne)}
.champ{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.champ label{font-size:13px;font-weight:600}
.champ{min-width:0}
.champ input,.champ select{width:100%;min-width:0;min-height:48px;border:1px solid var(--ligne);border-radius:12px;padding:0 12px;background:#fff;font-size:16px}
.raison{display:flex;gap:10px;padding:8px 0;align-items:flex-start}
.raison b{width:24px;height:24px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px}
.r-plus b{background:#E3F5EA;color:var(--vert)}.r-moins b{background:#FBE6E4;color:var(--rouge)}.r-attention b{background:var(--orange2);color:var(--orange)}.r-neutre b{background:var(--bleu2);color:var(--bleu)}
.grille3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.case{background:var(--fond);border-radius:14px;padding:10px;text-align:center}
.case .val{font-weight:700;font-size:18px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;background:#fff;border-top:1px solid var(--ligne);padding-bottom:env(safe-area-inset-bottom)}
nav div{max-width:520px;margin:0 auto;display:flex}
nav button{flex:1;min-height:62px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;color:var(--gris);cursor:pointer}
nav button span{font-size:21px;line-height:1}
nav button.on{color:var(--bleu)}
.feuille{position:fixed;inset:0;z-index:20;background:rgba(14,27,61,.45);display:flex;align-items:flex-end;justify-content:center;animation:fondu .2s both}
.feuille>div{background:var(--fond);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom));animation:monte .3s cubic-bezier(.2,.8,.2,1) both}
@keyframes fondu{from{opacity:0}}@keyframes monte{from{transform:translateY(40px);opacity:0}}
.fermer{width:44px;height:44px;border:0;border-radius:14px;background:#fff;font-size:20px;cursor:pointer}
.msg{display:flex;gap:12px;align-items:flex-start}
.msg .ic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px}
.m-alerte .ic{background:var(--orange2)}.m-info .ic{background:var(--bleu2)}.m-faire .ic{background:var(--bleu);color:#fff}
.vide-etat{text-align:center;padding:24px 8px;color:var(--gris)}
.celeb{position:fixed;inset:0;z-index:30;background:#1A1235;display:flex;flex-direction:column;justify-content:flex-end}
.celeb video,.celeb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.celeb .c-carte{position:relative;margin:16px;padding:18px;border-radius:22px;background:#fff;animation:monte .5s cubic-bezier(.2,.8,.2,1) 1.7s both}
.celeb img{display:none}
.hors{background:var(--orange2);color:var(--orange);font-size:13px;font-weight:600;padding:8px 16px;text-align:center}

.petit{width:auto!important;min-height:40px!important;padding:0 12px}
.appel{display:flex;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer;font:inherit}
.appel>span:nth-child(2){flex:1;min-width:0}
.chev{font-size:26px;color:var(--bleu)}
.puces{display:flex;gap:6px;margin:6px 0}
.puce-choix{flex:1;min-height:44px;border-radius:12px;border:1px solid var(--ligne);background:#fff;font-weight:600;font-size:14px;cursor:pointer;transition:all .2s}
.puce-choix.on{background:var(--bleu);border-color:var(--bleu);color:#fff;transform:scale(1.02)}
.trois{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.trois>div{border-radius:14px;padding:10px 8px;text-align:center;animation:entree .4s both}
.trois b{display:block;font-size:15px;margin-top:4px}
.t-mal{background:#FBEDEC}.t-mal b{color:var(--rouge)}
.t-prob{background:var(--bleu);color:#fff}.t-prob .gris{color:rgba(255,255,255,.85)}
.t-bien{background:#E3F5EA}.t-bien b{color:var(--vert)}
.critere{margin:10px 0}
.jauge{height:10px;border-radius:5px;background:#EEF2FA;overflow:hidden;margin-top:5px}
.jauge span{display:block;height:100%;border-radius:5px;transform-origin:left;animation:pousse .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes pousse{from{transform:scaleX(0)}}
.grandes-etoiles span{display:inline-block;font-size:34px;color:var(--or);animation:pop .45s ease-out both}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
.pop{animation:pop .5s ease-out both}
button.case{border:0;font:inherit;cursor:pointer}
.anneau{flex-shrink:0;animation:tourne .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes tourne{from{transform:rotate(-90deg);opacity:0}}
.leg-ligne{display:flex;gap:8px;align-items:flex-start;margin:5px 0;font-size:13px}
.leg-ligne i{width:12px;height:12px;border-radius:4px;flex-shrink:0;margin-top:3px}
.legende{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--gris)}
.legende i{display:inline-block;width:12px;height:6px;border-radius:3px;margin-right:4px;vertical-align:middle}
.compteur{font-size:32px;font-weight:800;letter-spacing:-.5px}
.etiquette{font-size:12px;font-weight:700;padding:4px 10px;border-radius:10px}
.e-prevu{background:#E3F5EA;color:var(--vert)}.e-mieux{background:var(--bleu2);color:var(--bleu)}.e-moins{background:var(--orange2);color:var(--orange)}.e-depart{background:var(--bleu2);color:var(--bleu)}
.cause{display:grid;grid-template-columns:120px 1fr 64px;gap:8px;align-items:center;margin:8px 0;font-size:13px}
.cause .jauge{margin:0}
.etapes{display:flex;justify-content:space-between;gap:4px}
.etapes>div{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1}
.etapes span{width:34px;height:34px;border-radius:17px;display:flex;align-items:center;justify-content:center;font-weight:700;background:#E8EDF7;color:var(--gris)}
.etapes .fait span{background:var(--bleu);color:#fff;animation:pop .4s both}
.etapes small{font-size:11px;color:var(--gris)}
.badge-carte{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,#FFF6E0,#fff)}
.badge-carte>span{font-size:34px;animation:pop .6s both}
.flip{display:block;width:100%;height:200px;perspective:1000px;border:0;background:none;padding:0;cursor:pointer;font:inherit}
.flip-in{position:relative;display:block;width:100%;height:100%;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.flip.retourne .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;padding:18px;display:flex;flex-direction:column;justify-content:center;gap:10px;text-align:left;background:linear-gradient(135deg,#1747C9,#3E6BE6);color:#fff}
.face b{font-size:19px}
.face small{font-weight:700;letter-spacing:1px;opacity:.8}
.face .gris{color:rgba(255,255,255,.8)}
.face.dos{transform:rotateY(180deg);background:#fff;color:var(--encre);border:1px solid var(--ligne)}
.defile{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 8px;margin:0 -16px;padding-left:16px;padding-right:16px}
.lecon{scroll-snap-align:start;flex:0 0 168px;min-height:150px;display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:18px;background:#fff;border:1px solid var(--bleu);text-align:left;cursor:pointer;font:inherit}
.lecon.faite{border-color:var(--ligne)}
.lecon .ic{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;background:var(--bleu2)}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.badges>div{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:14px;background:#fff;border:1px solid var(--ligne);opacity:.5;text-align:center}
.badges>div.ok{opacity:1}
.badges span{width:40px;height:40px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;background:#E8EDF7;color:var(--gris)}
.badges .ok span{background:var(--bleu);color:#fff}
.badges small{font-size:11px;line-height:1.2}
.question{font-size:21px;font-weight:700;line-height:1.3;margin-bottom:14px;animation:entree .35s both}
.option{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:12px 16px;margin-bottom:8px;border-radius:16px;border:2px solid var(--ligne);background:#fff;text-align:left;font:inherit;font-weight:500;cursor:pointer;transition:all .2s;animation:entree .35s both}
.option i{width:20px;height:20px;border-radius:10px;border:2px solid #A9B8DA;flex-shrink:0;transition:all .2s}
.option.on{border-color:var(--bleu);background:var(--bleu2);font-weight:700;transform:scale(1.02)}
.option.on i{border:6px solid var(--bleu)}
.bouton:disabled{opacity:.45}
.lien{border:0;background:none;color:var(--bleu);font-weight:700;padding:8px 0 0;cursor:pointer;font:inherit;font-weight:700}
.non-lu{width:9px;height:9px;border-radius:5px;background:var(--bleu);flex-shrink:0}
.sans-anim,.sans-anim>div{animation:none!important}
.colonne{width:100%;max-width:36px;border-radius:6px 6px 2px 2px;transform-origin:bottom;animation:pousseH .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes pousseH{from{transform:scaleY(0)}}
nav button{font-size:10.5px}
.feu{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;margin-top:4px;padding:2px 8px 2px 6px;border-radius:10px}
.feu i{width:10px;height:10px;border-radius:5px;background:currentColor}
.f-vert{color:#1F9D55;background:#E3F5EA}.f-orange{color:#B86E00;background:#FFF1DA}.f-rouge{color:#C0362C;background:#FBEDEC}.f-gris{color:#6B7690;background:#EEF1F6}
.solva{position:relative;height:12px;border-radius:6px;background:#EEF2FA;margin:8px 0 4px}
.solva span{display:block;height:100%;border-radius:6px;transform-origin:left;animation:pousse .7s cubic-bezier(.2,.8,.2,1) both}
.solva i{position:absolute;top:-4px;width:2px;height:20px;background:#0E1B3D}
.solva i.moy{background:#7E95D6}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.celeb video{display:none}.celeb img{display:block}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>BRVM Analyse<small id="sousTitre">Chargement…</small></h1>
    <button class="cloche" id="cloche" aria-label="Messages">🔔<span class="pastille" id="pastille" hidden></span></button>
  </header>
  <div class="hors" id="hors" hidden>Hors connexion : derniers résultats enregistrés</div>
  <main id="ecran"></main>
</div>
<nav><div id="nav"></div></nav>
<div id="couche"></div>

<script src="app.js"></script>
</body>
</html>
